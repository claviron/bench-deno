[package]
name = "bench-deno"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Matched HTTP workloads for embedded and native Deno"

[dependencies]
# Application runtime
claviron = { version = "0.2.0-alpha.23", default-features = false, features = ["edge"] }
claviron-deno = { version = "0.2.0-alpha.23", default-features = false, features = ["edge", "fetch"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Command line
clap = { version = "4", features = ["derive"] }

# Allocator
mimalloc = "0.1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "unwind"
